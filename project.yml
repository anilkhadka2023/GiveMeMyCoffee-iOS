# XcodeGen spec — an alternative to the checked-in GiveMeMyCoffee.xcodeproj.
# Regenerate the project with:  brew install xcodegen && xcodegen generate
name: GiveMeMyCoffee
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig
targets:
  GiveMeMyCoffee:
    type: application
    platform: iOS
    sources:
      - path: GiveMeMyCoffee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.givememycoffee
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Give Me My Coffee
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Your location is used to find cafés near you.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ENABLE_PREVIEWS: YES
